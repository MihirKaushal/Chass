<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9EDD7"/>
      <stop offset="1" stop-color="#EAD8B5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#63B3ED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#63B3ED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="blueprint" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#2B6CB0" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
    <pattern id="board" width="96" height="96" patternUnits="userSpaceOnUse">
