    <text x="848" y="474" fill="#F5E6CA" stroke="#1A365D" stroke-width="1.2" paint-order="stroke" font-size="40">♙</text>
    <text x="944" y="474" fill="#F5E6CA" stroke="#1A365D" stroke-width="1.2" paint-order="stroke" font-size="40">♕</text>
    <text x="1040" y="474" fill="#F5E6CA" stroke="#1A365D" stroke-width="1.2" paint-order="stroke" font-size="40">♔</text>
