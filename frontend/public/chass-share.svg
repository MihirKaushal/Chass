      <rect width="48" height="48" fill="#D4B98B"/>
      <rect x="48" y="48" width="48" height="48" fill="#D4B98B"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1A365D" flood-opacity="0.22"/>
    </filter>
    <clipPath id="board-clip">
      <rect x="728" y="110" width="384" height="384" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
