  <text x="76" y="347" fill="#1A365D" font-family="Futura, Avenir Next, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">CHESS,</text>
  <text x="76" y="417" fill="#1A365D" font-family="Futura, Avenir Next, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">RECONFIGURED.</text>
