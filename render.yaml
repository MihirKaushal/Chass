services:
  - type: web
    name: chass-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: INVITE_TTL_HOURS
        value: "24"
      - key: GAME_TTL_DAYS
        value: "30"
