services:
  - type: web
    name: chass-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      # Keep this as "sql" until Firebase credentials are configured in Render.
      - key: PERSISTENCE_BACKEND
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: INVITE_TTL_HOURS
        value: "24"
      - key: GAME_IDLE_TTL_HOURS
        value: "24"
      - key: GAME_CLEANUP_INTERVAL_MINUTES
        value: "15"
