name: Verify Chass
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run: .venv/bin/ruff check backend scripts && .venv/bin/python scripts/export_rulebook.py --check
      - run: .venv/bin/pytest
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 14
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-chass-ci
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-chass-ci --config .ci/firebase.json '.venv/bin/pytest backend/tests/test_firestore_emulator.py -q'
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run: bash scripts/install_stockfish.sh && bash scripts/install_fairy_stockfish.sh
      - run: .venv/bin/python scripts/engine_smoke.py
      - run: .venv/bin/python scripts/benchmark_chass.py --output engine-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-engine-benchmark
          path: engine-benchmark.json
  scanner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt -r scanner/deploy/requirements-onnx.txt
      - run: .venv/bin/python scripts/scanner_contract_smoke.py
